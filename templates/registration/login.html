{% extends "base.html" %}

{% block title %}Log in · Internship Tracker{% endblock %}

{% block content %}
  <article style="max-width: 28rem; margin-inline: auto;">
    <h1>Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
    <p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
  </article>
{% endblock %}
