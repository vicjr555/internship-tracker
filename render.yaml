# Render Blueprint: one web service + one PostgreSQL database.
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: internship-tracker-db
    plan: free
    databaseName: internship_tracker
    user: internship_tracker

services:
  - type: web
    name: internship-tracker
    runtime: python
    plan: free
    buildCommand: ./build.sh
    # --timeout 120: a sync downloads and processes a ~13 MB file; give it room.
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: internship-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SYNC_TOKEN
        generateValue: true # Copy this value into the GitHub secret SYNC_TOKEN.
      - key: DEBUG
        value: "False"
      # Your *.onrender.com hostname is added automatically (see settings.py).
      # Set these only if you add a custom domain.
      - key: ALLOWED_HOSTS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""
      # Admin account created by build.sh on first deploy (set these in the dashboard).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
